AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Web Servers with ALB, Auto Scaling and Azure HLS Video Player

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # APPLICATION LOAD BALANCER

  WebLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: Portfolio-WebPublicSubnet1-ID
        - Fn::ImportValue: Portfolio-WebPublicSubnet2-ID
      SecurityGroups:
        - Fn::ImportValue: Portfolio-ALB-SG-ID
      Tags:
        - Key: Name
          Value: Portfolio-Web-ALB

  # TARGET GROUP

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'

  # HTTP LISTENER

  WebListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WebLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # REVIEW: private web instances need a route to yum/dnf package repositories
  # via an approved NAT or a suitable prebuilt AMI before deployment.
  # EC2 LAUNCH TEMPLATE

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: false
            DeleteOnTermination: true
            Groups:
              - Fn::ImportValue: Portfolio-Web-SG-ID

        UserData:
          Fn::Base64: |
            #!/bin/bash
            set -e

            dnf install -y httpd
            systemctl enable httpd

            cat > /var/www/html/index.html <<'EOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">

              <title>AWS Azure Multicloud Video Portfolio</title>

              <style>
                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  font-family: Arial, sans-serif;
                  background: #0f172a;
                  color: white;
                }

                header {
                  background: #1e293b;
                  padding: 25px;
                  text-align: center;
                }

                header h1 {
                  color: #38bdf8;
                  margin: 0;
                }

                main {
                  max-width: 1000px;
                  margin: 30px auto;
                  padding: 20px;
                }

                .card {
                  background: #1e293b;
                  padding: 25px;
                  border-radius: 12px;
                  margin-bottom: 20px;
                }

                h2 {
                  color: #38bdf8;
                }

                video {
                  width: 100%;
                  background: black;
                  border-radius: 8px;
                }

                input {
                  width: 100%;
                  padding: 12px;
                  margin: 10px 0;
                  border-radius: 6px;
                  border: 1px solid #64748b;
                }

                button {
                  padding: 12px 24px;
                  background: #0284c7;
                  color: white;
                  border: none;
                  border-radius: 6px;
                  cursor: pointer;
                }

                button:hover {
                  background: #0369a1;
                }

                .status {
                  color: #facc15;
                  margin-top: 12px;
                }

                .features {
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                  gap: 15px;
                }

                .feature {
                  background: #334155;
                  padding: 20px;
                  border-radius: 8px;
                }

                footer {
                  text-align: center;
                  padding: 25px;
                  color: #cbd5e1;
                }
              </style>

              <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
            </head>

            <body>
              <header>
                <h1>AWS Azure Multicloud Portfolio</h1>
                <p>Cloud Video Streaming Project</p>
              </header>

              <main>

                <section class="card">
                  <h2>Steamboat Willie Video Streaming</h2>

                  <p>
                    The website runs on AWS EC2, while video
                    segments are hosted in Azure Blob Storage.
                  </p>

                  <video id="videoPlayer" controls playsinline></video>

                  <p id="status" class="status">
                    Waiting for playback access.
                  </p>
                </section>

                <section class="card">
                  <h2>Azure Video Access</h2>

                  <p>
                    Enter a temporary read-only container SAS
                    token for testing. Do not use a permanent
                    storage account key.
                  </p>

                  <input
                    type="password"
                    id="sasToken"
                    placeholder="Paste temporary SAS token"
                    autocomplete="off"
                  >

                  <button id="playButton" type="button">
                    Load Azure Video
                  </button>

                  <p>
                    A valid token must allow access to the
                    master playlist, quality playlists and
                    video segments.
                  </p>
                </section>

                <section class="card">
                  <h2>Multicloud Architecture</h2>

                  <div class="features">

                    <div class="feature">
                      <h3>AWS EC2</h3>
                      <p>Hosts the video website.</p>
                    </div>

                    <div class="feature">
                      <h3>AWS Load Balancer</h3>
                      <p>Distributes website traffic.</p>
                    </div>

                    <div class="feature">
                      <h3>Azure Blob Storage</h3>
                      <p>Stores HLS playlists and video segments.</p>
                    </div>

                    <div class="feature">
                      <h3>Adaptive Streaming</h3>
                      <p>Supports 360p and 480p video.</p>
                    </div>

                  </div>
                </section>

              </main>

              <footer>
                <p>
                  AWS and Azure Multicloud Portfolio
                </p>
                <p>
                  Infrastructure deployed with GitHub and CloudFormation
                </p>
              </footer>

              <script>
                const video = document.getElementById("videoPlayer");
                const status = document.getElementById("status");
                const tokenInput = document.getElementById("sasToken");

                const manifest =
                  "https://portfoliovideostore26.blob.core.windows.net/video/master.m3u8";

                let hls = null;

                document.getElementById("playButton")
                  .addEventListener("click", loadVideo);

                function loadVideo() {

                  const token = tokenInput.value.trim().replace(/^\?/, "");

                  if (!token) {
                    status.textContent = "Enter a temporary SAS token.";
                    return;
                  }

                  const params = new URLSearchParams(token);

                  if (!params.has("sig") || !params.has("se")) {
                    status.textContent = "Invalid SAS token format.";
                    return;
                  }

                  if (typeof Hls === "undefined") {
                    status.textContent = "HLS player library did not load.";
                    return;
                  }

                  if (!Hls.isSupported()) {
                    status.textContent =
                      "Use Chrome or Edge for this authenticated HLS test.";
                    return;
                  }

                  if (hls) {
                    hls.destroy();
                  }

                  hls = new Hls({
                    enableWorker: true,
                    xhrSetup: function(xhr, url) {
                      const separator = url.includes("?") ? "&" : "?";
                      xhr.open("GET", url + separator + token, true);
                    }
                  });

                  status.textContent = "Loading video from Azure...";

                  hls.loadSource(manifest);
                  hls.attachMedia(video);

                  hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    status.textContent = "Video ready.";
                    video.play().catch(function() {
                      status.textContent =
                        "Video ready. Press Play to start.";
                    });
                  });

                  hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                      status.textContent =
                        "Playback error: " + data.details;
                    }
                  });

                  tokenInput.value = "";
                }
              </script>

            </body>
            </html>
            EOF

            systemctl start httpd

  # REVIEW: ASG subnet switch can replace running instances. Do not deploy
  # until private subnet outbound access and existing stack export collisions are checked.
  # AUTO SCALING GROUP

  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: WebListener
    Properties:
      VPCZoneIdentifier:
        - Fn::ImportValue: Portfolio-WebPrivateSubnet1-ID
        - Fn::ImportValue: Portfolio-WebPrivateSubnet2-ID

      MinSize: '1'
      MaxSize: '2'
      DesiredCapacity: '2'

      HealthCheckType: ELB
      HealthCheckGracePeriod: 300

      TargetGroupARNs:
        - !Ref WebTargetGroup

      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber

      Tags:
        - Key: Name
          Value: Portfolio-Web-EC2
          PropagateAtLaunch: true

Outputs:

  LoadBalancerDNS:
    Description: Public DNS name of the ALB
    Value: !GetAtt WebLoadBalancer.DNSName
    Export:
      Name: Portfolio-ALB-DNS

  AutoScalingGroupName:
    Description: Auto Scaling Group name
    Value: !Ref WebAutoScalingGroup
