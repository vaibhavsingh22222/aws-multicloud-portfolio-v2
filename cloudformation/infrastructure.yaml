AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Multicloud Portfolio - VPC Infrastructure
Resources:
  WebVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value: Web-VPC
  PrivateVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value: Private-VPC
Outputs:
  WebVPCId:
    Value:
      Ref: WebVPC
    Export:
      Name: Portfolio-WebVPC-ID
  PrivateVPCId:
    Value:
      Ref: PrivateVPC
    Export:
      Name: Portfolio-PrivateVPC-ID
