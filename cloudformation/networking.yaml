AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Networking with Subnets and Transit Gateway
Resources:
  WebPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      CidrBlock: 10.10.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value: Web-Public-1
      MapPublicIpOnLaunch: true
  WebPublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      CidrBlock: 10.10.2.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value: Web-Public-2
      MapPublicIpOnLaunch: true
  WebPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      CidrBlock: 10.10.11.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value: Web-Private-1
  WebPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      CidrBlock: 10.10.12.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value: Web-Private-2
  DataPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-PrivateVPC-ID
      CidrBlock: 10.20.1.0/24
      AvailabilityZone:
        Fn::Select:
        - 0
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value: Data-Private-1
  DataPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-PrivateVPC-ID
      CidrBlock: 10.20.2.0/24
      AvailabilityZone:
        Fn::Select:
        - 1
        - Fn::GetAZs: ''
      Tags:
      - Key: Name
        Value: Data-Private-2
  WebInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value: Web-Internet-Gateway
  WebIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      InternetGatewayId:
        Ref: WebInternetGateway
  WebPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      Tags:
      - Key: Name
        Value: Web-Public-RT
  WebPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      Tags:
      - Key: Name
        Value: Web-Private-RT
  DataPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Fn::ImportValue: Portfolio-PrivateVPC-ID
      Tags:
      - Key: Name
        Value: Data-Private-RT
  WebPublicInternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: WebPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: WebInternetGateway
    DependsOn: WebIGWAttachment
  PublicSubnetAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: WebPublicSubnet1
      RouteTableId:
        Ref: WebPublicRouteTable
  PublicSubnetAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: WebPublicSubnet2
      RouteTableId:
        Ref: WebPublicRouteTable
  WebPrivateAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: WebPrivateSubnet1
      RouteTableId:
        Ref: WebPrivateRouteTable
  WebPrivateAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: WebPrivateSubnet2
      RouteTableId:
        Ref: WebPrivateRouteTable
  DataPrivateAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: DataPrivateSubnet1
      RouteTableId:
        Ref: DataPrivateRouteTable
  DataPrivateAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: DataPrivateSubnet2
      RouteTableId:
        Ref: DataPrivateRouteTable
  WebNatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
    DependsOn: WebIGWAttachment
  WebNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId:
        Fn::GetAtt:
        - WebNatEIP
        - AllocationId
      SubnetId:
        Ref: WebPublicSubnet1
      Tags:
      - Key: Name
        Value: Portfolio-Web-NAT
    DependsOn: WebIGWAttachment
  WebPrivateInternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: WebPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Ref: WebNatGateway
  PortfolioTransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: Connect Web VPC and Data VPC
      AmazonSideAsn: 64512
      DnsSupport: enable
      DefaultRouteTableAssociation: enable
      DefaultRouteTablePropagation: enable
      Tags:
      - Key: Name
        Value: Portfolio-Transit-Gateway
  WebTransitAttachment:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties:
      TransitGatewayId:
        Ref: PortfolioTransitGateway
      VpcId:
        Fn::ImportValue: Portfolio-WebVPC-ID
      SubnetIds:
      - Ref: WebPrivateSubnet1
      - Ref: WebPrivateSubnet2
      Tags:
      - Key: Name
        Value: Web-TGW-Attachment
  DataTransitAttachment:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties:
      TransitGatewayId:
        Ref: PortfolioTransitGateway
      VpcId:
        Fn::ImportValue: Portfolio-PrivateVPC-ID
      SubnetIds:
      - Ref: DataPrivateSubnet1
      - Ref: DataPrivateSubnet2
      Tags:
      - Key: Name
        Value: Data-TGW-Attachment
  WebToDataRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: WebPrivateRouteTable
      DestinationCidrBlock: 10.20.0.0/16
      TransitGatewayId:
        Ref: PortfolioTransitGateway
    DependsOn:
    - WebTransitAttachment
    - DataTransitAttachment
  DataToWebRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Ref: DataPrivateRouteTable
      DestinationCidrBlock: 10.10.0.0/16
      TransitGatewayId:
        Ref: PortfolioTransitGateway
    DependsOn:
    - WebTransitAttachment
    - DataTransitAttachment
Outputs:
  TransitGatewayId:
    Value:
      Ref: PortfolioTransitGateway
  WebPublicSubnet1Id:
    Value:
      Ref: WebPublicSubnet1
    Export:
      Name: Portfolio-WebPublicSubnet1-ID
  WebPublicSubnet2Id:
    Value:
      Ref: WebPublicSubnet2
    Export:
      Name: Portfolio-WebPublicSubnet2-ID
  WebPrivateSubnet1Id:
    Value:
      Ref: WebPrivateSubnet1
    Export:
      Name: Portfolio-WebPrivateSubnet1-ID
  WebPrivateSubnet2Id:
    Value:
      Ref: WebPrivateSubnet2
    Export:
      Name: Portfolio-WebPrivateSubnet2-ID
  DataPrivateSubnet1Id:
    Value:
      Ref: DataPrivateSubnet1
    Export:
      Name: Portfolio-DataPrivateSubnet1-ID
  DataPrivateSubnet2Id:
    Value:
      Ref: DataPrivateSubnet2
    Export:
      Name: Portfolio-DataPrivateSubnet2-ID
