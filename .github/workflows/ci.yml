
name: AWS CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Check CloudFormation Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CloudFormation Linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install cfn-lint

      - name: Check AWS YAML Files
        run: |
          test -f cloudformation/infrastructure.yaml
          test -f cloudformation/networking.yaml
          test -f cloudformation/security.yaml
          test -f cloudformation/compute.yaml

      - name: Validate AWS Templates
        run: |
          cfn-lint cloudformation/*.yaml

      - name: CI Complete
        run: echo "CloudFormation CI checks passed"
